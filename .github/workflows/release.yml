name: release

# Builds meridian-mcp natively on Linux, Windows, and macOS, smoke-tests every binary on the OS it was
# built for, and uploads one package per platform. Run it by hand (Actions > release > Run workflow)
# or push a tag like v0.1.0, which also attaches the packages and SHA256SUMS to a GitHub release.
# marketing/publish-meridian-mcp.sh then publishes the downloaded packages to the Meridian site.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64,   runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu,  exe: meridian-mcp,     format: tar }
          - { label: windows-x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc,    exe: meridian-mcp.exe, format: zip }
          - { label: macos-arm64,    runner: macos-latest, target: aarch64-apple-darwin,      exe: meridian-mcp,     format: tar }
          # Built on the arm64 runner and cross-compiled; smoke-tested under Rosetta.
          - { label: macos-x86_64,   runner: macos-latest, target: x86_64-apple-darwin,       exe: meridian-mcp,     format: tar, rosetta: true }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Read the version
        id: version
        shell: bash
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test (on the platform it was built for)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          if [ "${{ matrix.rosetta }}" = "true" ]; then
            softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
            arch -x86_64 /usr/bin/true
          fi
          python3 packaging/smoke.py "$BIN" "${{ steps.version.outputs.value }}"

      - name: Package
        id: package
        shell: bash
        run: |
          NAME="meridian-mcp-${{ steps.version.outputs.value }}-${{ matrix.label }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$NAME/"
          cp packaging/README.txt "dist/$NAME/README.txt"
          cd dist
          if [ "${{ matrix.format }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$NAME' -DestinationPath '$NAME.zip'"
            FILE="$NAME.zip"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
            FILE="$NAME.tar.gz"
          fi
          rm -rf "$NAME"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$FILE" > "$FILE.sha256"; else shasum -a 256 "$FILE" > "$FILE.sha256"; fi
          cat "$FILE.sha256"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: meridian-mcp-${{ matrix.label }}
          path: |
            dist/${{ steps.package.outputs.file }}
            dist/${{ steps.package.outputs.file }}.sha256
          if-no-files-found: error

  release:
    name: attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "meridian-mcp ${{ github.ref_name }}" \
            --notes "Unsigned builds for Linux (x86_64), Windows (x86_64), and macOS (arm64, x86_64). Verify against SHA256SUMS." \
            *.tar.gz *.zip SHA256SUMS